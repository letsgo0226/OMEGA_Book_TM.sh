name: OMEGA Book TM

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [omega-book]

permissions:
  contents: read

concurrency:
  group: omega-book-tm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify one-liner invariant
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < OMEGA_Book_TM.sh)" -lt 2048
          bash -n OMEGA_Book_TM.sh
          chmod +x OMEGA_Book_TM.sh

      - name: Build deterministic AI oracle
        shell: bash
        run: |
          cat >/tmp/omega-ai <<'PY'
          #!/usr/bin/env python3
          import sys
          q=sys.stdin.read()
          if "Return exactly" in q:
              print("Formal Verification")
          else:
              p=("Formal verification establishes explicit premises, definitions, arguments, objections, replies, examples, and conclusions while distinguishing formal validity from empirical truth. ")
              print((p*80)+"\n\nChapter Summary\n"+(p*20))
          PY
          chmod +x /tmp/omega-ai

      - name: Execute OMEGA Book TM
        shell: bash
        env:
          AI: /tmp/omega-ai
        run: |
          set -euo pipefail
          ./OMEGA_Book_TM.sh "CI Formal Verification" /tmp/omega_book_ci.txt 1 | tee /tmp/omega.log
          grep -q '"STATE":"G"' /tmp/omega.log
          grep -q '"REV":true' /tmp/omega.log
          grep -q '"RETURN":true' /tmp/omega.log
          grep -q '"SPEC_OK":true' /tmp/omega.log
          grep -q '"BOOK_OK":true' /tmp/omega.log
          test -s /tmp/omega_book_ci.txt
